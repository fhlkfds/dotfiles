# #######################################################################################
# PLEASE READ THE WIKI FOR MORE INFORMATION.
# https://wiki.hypr.land/Configuring/
# #######################################################################################

################
### MONITORS ###
################

# Fallback monitor config. monitors.conf (sourced below) overrides this.
monitor=,preferred,auto,1

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Noctalia-shell IPC helper
$ipc = qs -c noctalia-shell ipc call

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# 3-finger horizontal swipe to switch workspace
gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

# Variables must be sourced BEFORE keybinding.conf so $scriptsDir is defined
source = ~/.config/hypr/conf/var.conf
source = ~/.config/hypr/conf/keybinding.conf
source = ~/.config/hypr/conf/windows-rules.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/decorations.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf