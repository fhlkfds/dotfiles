# Hand-edited workspace pinning for the main desktop (was generated by nwg-displays).
# WARNING: re-running nwg-displays "Apply" will overwrite this file.
# Monitors are matched by description instead of DP-1/HDMI-A-1 so these rules only
# ever apply to these exact monitors - the Framework laptop ignores them, even when
# docked to an external screen that happens to enumerate as DP-1.

$mainMon = desc:Sceptre Tech Inc Sceptre P30 0000000000000
$sideMon = desc:Dell Inc. DELL P2213 FJ44J55Q401M

# Main monitor (HDMI-A-1, Sceptre ultrawide): workspaces 1-5
# persistent:true = these always exist on this monitor, even when empty
workspace=1,monitor:$mainMon,default:true,persistent:true
workspace=2,monitor:$mainMon,persistent:true
workspace=3,monitor:$mainMon,persistent:true
workspace=4,monitor:$mainMon,persistent:true
workspace=5,monitor:$mainMon,persistent:true

# Second monitor (DP-1, Dell portrait): workspaces 6-10
workspace=6,monitor:$sideMon,default:true
workspace=7,monitor:$sideMon
workspace=8,monitor:$sideMon
workspace=9,monitor:$sideMon
workspace=10,monitor:$sideMon
