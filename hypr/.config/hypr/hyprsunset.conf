# hyprsunset -- screen colour temperature.
#
# hyprsunset is started from conf/autostart.conf so the first Super+Ctrl+N is
# instant, but this identity profile means it does nothing to the display until
# the toggle asks for warmth. Starting the daemon and warming the screen are
# deliberately separate things.
#
# The 1000K/6500K pair used by the toggle lives in scripts/night-light.sh, not
# here. Change it there.
#
# To warm automatically by the clock instead, replace the profile below with a
# time profile and the toggle will still work on top of it:
#
#   profile {
#       time = 20:00
#       temperature = 1000
#   }
#   profile {
#       time = 07:00
#       identity = true
#   }

profile {
    time = 00:00
    identity = true
}
