#exec-once = hyprpaper
# Clipboard history watchers. Still exactly two persistent processes; only the
# handler changed, to filter secrets and excluded apps before storing.
exec-once = wl-paste --type text --watch $HOME/.config/hypr/scripts/clipboard-store.sh
exec-once = wl-paste --type image --watch $HOME/.config/hypr/scripts/clipboard-store.sh
#exec-once = swaync
#exec-once = qs -c noctalia-shell
exec-once = quickshell
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/spotify-notify.sh
exec-once = /home/liam/.config/hypr/scripts/auto-monitor-profile.sh --watch
exec-once = [workspace 2 silent] brave
exec-once = [workspace 9 silent] spotify
exec-once = [workspace 6 silent] virt-manager
exec-once = [workspace 6 silent] hermes
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 1 silent] kitty

# Removable media: automount on insert + notify. No tray -- the Quickshell bar
# has no system tray; devices are managed from Nautilus's sidebar.
exec-once = udiskie --automount --notify --no-tray

# Night light daemon. hyprsunset.conf ships an identity profile, so starting it
# here leaves the display untouched -- it only means Super+Ctrl+N is instant.
exec-once = hyprsunset
