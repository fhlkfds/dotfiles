# ~/.config/hyprlock/colors.conf
# GENERATED from themes/{{ theme_slug }}/colors.toml — do not edit.
# Theme: {{ theme_name }} ({{ theme_mode }})
#
# Variable names are kept exactly as the previous generator emitted them, so the
# existing hyprlock layouts keep working unchanged.

# Primary
$primary   = {{ hex_no_hash(background) }}
$text      = {{ hex_no_hash(foreground_bright) }}
$bg        = {{ hex_no_hash(background_alt) }}

# Accents
$accent_1  = {{ hex_no_hash(accent) }}
$accent_2  = {{ hex_no_hash(accent_alt) }}
$accent_3  = {{ hex_no_hash(cyan) }}
$accent_4  = {{ hex_no_hash(magenta) }}

# Surfaces
$surface_1 = {{ hex_no_hash(surface) }}
$surface_2 = {{ hex_no_hash(surface_alt) }}
$overlay_1 = {{ hex_no_hash(overlay) }}

# rgba variants
$primary_rgba   = {{ hypr_rgba(background, 0.9) }}
$text_rgba      = {{ hypr_rgba(foreground_bright, 0.9) }}
$accent_1_rgba  = {{ hypr_rgba(accent, 0.9) }}
$accent_2_rgba  = {{ hypr_rgba(accent_alt, 0.9) }}
$accent_3_rgba  = {{ hypr_rgba(cyan, 0.9) }}
$accent_4_rgba  = {{ hypr_rgba(magenta, 0.9) }}
$surface_1_rgba = {{ hypr_rgba(surface, 0.9) }}
$surface_2_rgba = {{ hypr_rgba(surface_alt, 0.9) }}

# Dimmed variants
$primary_dim   = {{ hypr_rgba(background, 0.5) }}
$accent_1_dim  = {{ hypr_rgba(accent, 0.5) }}
$accent_2_dim  = {{ hypr_rgba(accent_alt, 0.5) }}

# Active lockscreen semantic tokens. The older names above remain available to
# the retained example layouts; the active layout uses these roles so its
# geometry and effects follow the same theme vocabulary as the rest of the
# desktop.
$lock_background      = {{ hypr_rgba(background, 1.0) }}
$lock_scrim           = {{ hypr_rgba(background, scrim_opacity) }}
$lock_surface         = {{ hypr_rgba(surface, surface_opacity) }}
$lock_input           = {{ hypr_rgba(background_alt, min(1.0, surface_opacity + 0.04)) }}
$lock_text            = {{ hypr_rgba(foreground_bright, 1.0) }}
$lock_muted           = {{ hypr_rgba(muted, 1.0) }}
$lock_accent          = {{ hypr_rgba(accent, 1.0) }}
$lock_border          = {{ hypr_rgba(border, 0.85) }}
$lock_border_gradient = {{ hypr_rgba(accent, 0.72) }} {{ hypr_rgba(accent_alt, 0.72) }} {{ border_angle }}
$lock_success         = {{ hypr_rgba(success, 1.0) }}
$lock_warning         = {{ hypr_rgba(warning, 1.0) }}
$lock_critical        = {{ hypr_rgba(critical, 1.0) }}
$lock_shadow          = {{ hypr_rgba(shadow, shadow_opacity) }}

$lock_rounding        = {{ radius_panel }}
$lock_input_rounding  = {{ radius_input }}
$lock_border_width    = {{ border_width }}
$lock_shadow_passes   = {{ 2 if shadow_opacity > 0 else 0 }}
$lock_shadow_size     = {{ max(3, round(shadow_range / 4)) }}

$lock_blur_passes     = {{ int(blur_passes) if blur else 0 }}
$lock_blur_size       = {{ int(blur_size) }}
$lock_blur_noise      = {{ blur_noise }}
$lock_blur_contrast   = {{ blur_contrast }}
$lock_blur_brightness = {{ blur_brightness }}
$lock_blur_vibrancy   = {{ blur_vibrancy }}
