general {
    # D-Bus lock requests (including the pre-suspend request below) start one
    # and only one hyprlock instance.
    lock_cmd = if test -x "$HOME/.local/bin/screensaver-lock"; then "$HOME/.local/bin/screensaver-lock"; else pidof hyprlock || hyprlock; fi

    # Block suspend until the session is actually locked, then restore the
    # displays after resume.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

# Hypridle cannot cancel the 300-second lock when the screensaver is dismissed.
# Keyboard input resets both timers; focus-only dismissal does not.
listener {
    timeout = 180
    # Retry while locked, disabled, already running, or while a PipeWire audio
    # output stream is running. Manual force launches bypass this condition.
    condition_cmd = test -x "$HOME/.local/bin/ascii-screensaver" && "$HOME/.local/bin/ascii-screensaver" condition
    condition_retry = 5
    on-timeout = "$HOME/.local/bin/ascii-screensaver" idle
}

listener {
    timeout = 300
    # Stay-awake gates idle locking only. If desktop-mode is absent, locking is
    # deliberately allowed; malformed mode state also fails closed in the CLI.
    condition_cmd = test ! -x "$HOME/.local/bin/desktop-mode" || "$HOME/.local/bin/desktop-mode" condition lock
    condition_retry = 5
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
