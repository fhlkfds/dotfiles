general {
    # D-Bus lock requests (including the pre-suspend request below) start one
    # and only one hyprlock instance.
    lock_cmd = pidof hyprlock || hyprlock

    # Block suspend until the session is actually locked, then restore the
    # displays after resume.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

# Match the former Noctalia idle timings, but use hyprlock consistently.
listener {
    timeout = 660
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
