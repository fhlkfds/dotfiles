[theme]
name = "Kanagawa"
slug = "kanagawa"
mode = "dark"
description = "Japanese ink painting — deep ink navy, warm beige, desaturated blue"
family = "kanagawa"

[colors]
# Kanagawa Wave. The warm/cool balance is the identity: cool ink surfaces under
# a warm beige foreground, with controlled warm orange and red as the only heat.
background       = "#1f1f28"
background_alt   = "#16161d"
surface          = "#2a2a37"
surface_alt      = "#363646"
overlay          = "#54546d"

foreground       = "#dcd7ba"
foreground_bright = "#f2ecdc"
muted            = "#9c9b93"
disabled         = "#727169"

accent           = "#7e9cd8"
accent_alt       = "#957fb8"

red              = "#e46876"
green            = "#98bb6c"
yellow           = "#dca561"
blue             = "#7e9cd8"
magenta          = "#957fb8"
cyan             = "#7aa89f"

selection        = "#2d4f67"
border           = "#363646"
border_active    = "#7e9cd8"
urgent           = "#e82424"
shadow           = "#0d0c12"

# Kanagawa's surimiOrange — the palette's designated warm signal.
warning          = "#ffa066"

[ansi]
# Kanagawa Wave's terminal set. The bright row is a genuinely warmer, more
# saturated family rather than a lift, which is what preserves the painterly
# warm/cool contrast in the terminal.
black          = "#16161d"
red            = "#c34043"
green          = "#76946a"
yellow         = "#c0a36e"
blue           = "#7e9cd8"
magenta        = "#957fb8"
cyan           = "#6a9589"
white          = "#c8c093"
bright_black   = "#727169"
bright_red     = "#e82424"
bright_green   = "#98bb6c"
bright_yellow  = "#e6c384"
bright_blue    = "#7fb4ca"
bright_magenta = "#938aa9"
bright_cyan    = "#7aa89f"
bright_white   = "#dcd7ba"

[style]
rounding = 8
border_width = 2
surface_opacity = 0.94
scrim_opacity = 0.50
shadow_opacity = 0.45
blur = true
blur_size = 6
blur_passes = 2
