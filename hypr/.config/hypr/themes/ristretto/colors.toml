[theme]
name = "Ristretto"
slug = "ristretto"
mode = "dark"
description = "Espresso and coffee — warm cream on roasted brown, orange and coral"
family = "monokai-pro"

[colors]
# Monokai Pro Ristretto. Warmer than any of the other dark themes: every
# surface is a brown, not a neutral or a navy.
background       = "#2c2525"
background_alt   = "#211c1c"
surface          = "#403838"
surface_alt      = "#5b5353"
overlay          = "#72696a"

foreground       = "#e6d9db"
foreground_bright = "#fff1f3"
muted            = "#a39e9b"
disabled         = "#72696a"

accent           = "#f38d70"
accent_alt       = "#a8a9eb"

red              = "#fd6883"
green            = "#adda78"
yellow           = "#f9cc6c"
blue             = "#85dacc"
magenta          = "#a8a9eb"
cyan             = "#85dacc"

selection        = "#5b5353"
border           = "#403838"
border_active    = "#f38d70"
urgent           = "#fd6883"
shadow           = "#171313"

warning          = "#f38d70"

[ansi]
# Monokai Pro Ristretto's terminal set. Coral rather than a true red, and no
# cool blue at all — the palette's `blue` slot is its aqua.
black          = "#2c2525"
red            = "#fd6883"
green          = "#adda78"
yellow         = "#f9cc6c"
blue           = "#f38d70"
magenta        = "#a8a9eb"
cyan           = "#85dacc"
white          = "#e6d9db"
bright_black   = "#72696a"
bright_red     = "#fd8a9f"
bright_green   = "#bfe295"
bright_yellow  = "#fbd98c"
bright_blue    = "#f6a68e"
bright_magenta = "#bcbdf0"
bright_cyan    = "#a0e3d8"
bright_white   = "#fff1f3"

[style]
# Solid and warm — no glass.
rounding = 8
border_width = 2
surface_opacity = 1.0
scrim_opacity = 0.55
shadow_opacity = 0.45
blur = false
blur_size = 4
blur_passes = 1
