warm_temperature = 1000
normal_temperature = 6500
maximum_duration_seconds = 86400
duration_presets = ["15m", "30m", "1h"]
reconcile_seconds = 2.0

# These are argv arrays, not shell strings. Left unset on purpose: the default
# resolves ~/.local/bin/<name> and falls back to a bare PATH lookup, which is
# what makes the daemon work when started from conf/autostart.lua (the Hyprland
# session PATH does not include ~/.local/bin). Set them only when a Stow package
# is installed somewhere non-standard, e.g.:
#
#   notification_command = ["/opt/hypr/bin/notificationctl"]
#   screensaver_command = ["/opt/hypr/bin/ascii-screensaver"]
