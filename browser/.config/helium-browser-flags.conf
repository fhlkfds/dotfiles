# Keep Helium at 1x when GTK text scaling is increased.
--force-device-scale-factor=1

# Hardware acceleration is off: Helium's GPU process page-faulted the AMD RX
# 6500 XT, forcing a full GPU reset (VRAM lost) that aborted Hyprland
# (2026-09-29). Remove this line to re-test after a mesa or Helium update.
--disable-gpu
