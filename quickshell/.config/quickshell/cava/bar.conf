# cava config for the Quickshell bar visualiser.
#
# Key spelling verified against the upstream example config
# (karlstav/cava, example_files/config): [general] bars/framerate/
# autosens/sensitivity/lower_cutoff_freq/higher_cutoff_freq and
# [output] method/raw_target/data_format/ascii_max_range/bar_delimiter.
#
# Raw ASCII output: one frame per line, 25 space-separated integers
# in 0..ascii_max_range, parsed by CavaState.qml.

[general]
framerate = 30
autosens = 1
sensitivity = 100
bars = 25
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 32
frame_delimiter = 10
