# cava config for the standalone cava-visualizer Quickshell instance.
#
# Follows the key spelling verified in cava/bar.conf against the upstream
# example config (karlstav/cava, example_files/config). This config is
# independent of ~/.config/cava/config and of the bar's cava/bar.conf.
#
# Raw ASCII output: one frame per line, 64 space-separated integers in
# 0..ascii_max_range, parsed by shell.qml.
#
# sleep_timer keeps this in sync with shell.qml's idleTimeoutMinutes:
# after that many seconds of silence cava stops the FFT and pauses frame
# output (waking automatically on new audio), and the visualizer treats
# the resulting frame gap as its idle state.

[general]
framerate = 30
autosens = 1
sensitivity = 100
bars = 64
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 180

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 32
frame_delimiter = 10
