# Active Hyprlock composition. Colors and structural values come from the
# generated colors.conf sourced by ~/.config/hypr/hyprlock.conf.

general {
    grace = 1
    hide_cursor = true
    # Empty Enter starts PAM so pam_u2f can wait for a security-key touch.
    ignore_empty_input = false
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

# The wallpaper backend owns the current-image state. Hyprlock 0.9.6 runs an
# empty-path reload command during setup; a missing/stale state therefore falls
# back to the theme background without exposing the unlocked desktop.
background {
    monitor =
    path =
    color = $lock_background
    reload_time = -1
    reload_cmd = $HOME/.local/bin/hypr-wallpaper-picker current

    blur_passes = $lock_blur_passes
    blur_size = $lock_blur_size
    noise = $lock_blur_noise
    contrast = $lock_blur_contrast
    brightness = $lock_blur_brightness
    vibrancy = $lock_blur_vibrancy
    vibrancy_darkness = 0.0
}

# A palette-colored scrim preserves readable contrast across bright and dark
# wallpapers while leaving the image recognizable.
shape {
    monitor =
    size = 100%, 100%
    color = $lock_scrim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_size = 96
    font_family = Noto Sans
    shadow_passes = $lock_shadow_passes
    shadow_size = $lock_shadow_size
    shadow_color = $lock_shadow
    position = 0, -105
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_muted
    font_size = 18
    font_family = Noto Sans
    shadow_passes = $lock_shadow_passes
    shadow_size = $lock_shadow_size
    shadow_color = $lock_shadow
    position = 0, -225
    halign = center
    valign = top
    zindex = 2
}

# Authentication card: the same raised-surface, themed-border language used by
# Quickshell panels and the Rofi launcher.
shape {
    monitor =
    size = 420, 180
    color = $lock_surface
    rounding = $lock_rounding
    border_size = $lock_border_width
    border_color = $lock_border_gradient
    shadow_passes = $lock_shadow_passes
    shadow_size = $lock_shadow_size
    shadow_color = $lock_shadow
    position = 0, -115
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text =   $USER
    color = $lock_text
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = $lock_border_width
    rounding = $lock_input_rounding
    outer_color = $lock_border_gradient
    inner_color = $lock_input
    font_color = $lock_text
    font_family = JetBrainsMono Nerd Font

    dots_size = 0.18
    dots_spacing = 0.22
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Enter password…</i>
    hide_input = false

    check_color = $lock_success
    check_text = <i>Authenticating…</i>
    fail_color = $lock_critical
    fail_text = <i>$FAIL</i>
    capslock_color = $lock_warning

    position = 0, -140
    halign = center
    valign = center
    zindex = 2
}
