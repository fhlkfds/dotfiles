# Hyprvoice runs whisper-cli, pw-record, wl-copy and notify-send by name, so the
# wrappers in this directory sit in front of all four. They name no hardware:
# the GPU is chosen per machine in ~/.local/share/hyprvoice-gpu/device.env
# (see hyprvoice-gpu-install).
# The file keeps its AMD-era name. Renaming it would leave a machine that only
# pulls with a dangling link, and so no PATH override, after its next restart.
[Service]
Environment=PATH=%h/.local/libexec/hyprvoice-gpu:%h/.local/bin:/usr/local/bin:/usr/bin
