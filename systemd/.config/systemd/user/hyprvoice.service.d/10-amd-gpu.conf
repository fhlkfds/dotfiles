# Hyprvoice looks up whisper-cli on PATH for each transcription.
# The wrapper refuses CPU-only results; the RADV ICD selects the RX 6400.
[Service]
Environment=PATH=%h/.local/libexec/hyprvoice-gpu:%h/.local/bin:/usr/local/bin:/usr/bin
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json
Environment=GGML_VK_VISIBLE_DEVICES=0
