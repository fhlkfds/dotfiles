# ----------------------------------------------------------
# Kitty theme: Dreamy Twilight Sky
# Wallpaper-inspired: indigo sky, lavender haze, comet cyan
# Balanced for screenshots and readable daily use
# ----------------------------------------------------------

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Layout / spacing
window_padding_width 14

# Transparency / blur
# Medium transparency looks good with this wallpaper, but too much
# can hurt readability depending on your compositor and background.
background_opacity 0.88

# Blur support depends on platform/compositor support.
# Lower this if performance or text clarity suffers.
background_blur 18

# Core colors
foreground              #E8ECFF
background              #1A1D46
selection_foreground    #F7F9FF
selection_background    #49559A
cursor                  #7FE7FF
cursor_text_color       #11152F

# URL color
url_color               #8BD8FF

# Tab bar - kept subtle to match the elegant/dreamy direction
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #171A3B

active_tab_foreground   #EAF0FF
active_tab_background   #39448A
inactive_tab_foreground #9CA7D9
inactive_tab_background #262B59

# ANSI 16-color palette
# Normal
color0  #141731   # black
color1  #A97A98   # red (muted mauve-rose)
color2  #8FE3D4   # green (moonlit mint)
color3  #F1D7A7   # yellow (starlight gold)
color4  #7FA8FF   # blue (periwinkle blue)
color5  #B89CFF   # magenta (lavender)
color6  #7FDFFF   # cyan (comet cyan)
color7  #C9D2F7   # white

# Bright
color8  #4D5585   # bright black
color9  #D39FBE   # bright red
color10 #B2F0E4   # bright green
color11 #F7E4B9   # bright yellow
color12 #A8BFFF   # bright blue
color13 #D1B8FF   # bright magenta
color14 #A8EEFF   # bright cyan
color15 #F4F7FF   # bright white
include /home/liam/.config/kitty/theme/current-theme.conf
