# Example GnuPG agent configuration.
#
# Copy this file into ~/.gnupg/gpg-agent.conf; see README.md.

# Expose an OpenSSH-compatible agent socket through gpg-agent.
enable-ssh-support

# Remember approved SSH keys for one hour.
default-cache-ttl-ssh 3600
max-cache-ttl-ssh 3600

# Remember GnuPG passphrase approvals for one hour, with a two-hour maximum.
default-cache-ttl 3600
max-cache-ttl 7200
