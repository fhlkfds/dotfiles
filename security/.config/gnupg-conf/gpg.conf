# Example GnuPG configuration.
#
# Copy this file into ~/.gnupg/gpg.conf; see README.md.

# Prefer the authenticated keys.openpgp.org keyserver.
keyserver hkps://keys.openpgp.org

# Route passphrase prompts through gpg-agent.
# (use-agent is a no-op with GnuPG 2.1+; kept only for older versions.)
use-agent
